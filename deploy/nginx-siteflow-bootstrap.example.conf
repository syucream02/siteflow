# REVIEW ONLY: apply only after approval; initial upstream stays legacy3002.
server {
    listen 80;
    server_name 13.237.188.172;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://13.237.188.172$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name 13.237.188.172;

    ssl_certificate /etc/letsencrypt/live/13.237.188.172/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/13.237.188.172/privkey.pem;

    location / {
        include /etc/nginx/siteflow/upstream.inc;
        proxy_hide_header X-SiteFlow-Slot;
        add_header X-SiteFlow-Slot $siteflow_slot always;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
