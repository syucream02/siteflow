name: Docker Build and Smoke Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write


jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t siteflow:ci .

      - name: Run unit tests
        run: docker run --rm siteflow:ci node --test tests/domain.test.mjs

      - name: Start Docker container
        run: docker run -d --name siteflow-ci -p 127.0.0.1:3000:3000 siteflow:ci

      - name: Check HTTP response
        run: |
          for i in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/ -o /dev/null; then
              echo "SiteFlow HTTP check passed"
              exit 0
            fi
            sleep 2
          done
          docker logs siteflow-ci
          exit 1

      - name: Show container logs
        if: failure()
        run: docker logs siteflow-ci

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker tag siteflow:ci "$IMAGE_NAME:${GITHUB_SHA}"
          docker push "$IMAGE_NAME:${GITHUB_SHA}"
