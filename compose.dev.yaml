name: siteflow-dev

services:
  mysql:
    image: mysql:8.4.13
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Set MYSQL_DATABASE in .env.mysql.local}
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER in .env.mysql.local}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env.mysql.local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env.mysql.local}
      MYSQL_ROOT_HOST: localhost
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - 'MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP -h 127.0.0.1 -u "$${MYSQL_USER}" -D "$${MYSQL_DATABASE}" --batch --skip-column-names -e "SELECT 1" >/dev/null 2>&1'
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 24

volumes:
  mysql-data:
